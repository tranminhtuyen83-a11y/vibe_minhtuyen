<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - TravelViet</title>
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body style="background-color: var(--bg-main); display: flex; align-items: center; justify-content: center; min-height: 100vh;">

  <div style="width: 100%; max-width: 440px; padding: 1.5rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="logo" style="justify-content: center; font-size: 2rem;">
        <i class="fa-solid fa-plane-departure" style="color: var(--accent);"></i> TravelViet
      </a>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">Đăng nhập để trải nghiệm dịch vụ du lịch hàng đầu</p>
    </div>

    <div class="search-box-card">
      <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 1.5rem; text-align: center;">Đăng Nhập Tài Khoản</h2>

      <div id="loginAlert" style="display: none; padding: 0.8rem; border-radius: var(--radius-sm); margin-bottom: 1.2rem; font-size: 0.88rem;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Tên đăng nhập hoặc Email</label>
          <input type="text" id="loginIdentity" class="form-control" placeholder="admin@travel.com hoặc user@travel.com" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label mb-0">Mật khẩu</label>
            <a href="forgot-password.html" style="font-size: 0.8rem;">Quên mật khẩu?</a>
          </div>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">
          <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
        </button>
      </form>

      <!-- Preset Seed Account Hints -->
      <div style="margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px solid var(--border-color); font-size: 0.82rem; background: #f8fafc; padding: 1rem; border-radius: var(--radius-sm);">
        <strong style="color: var(--primary);"><i class="fa-solid fa-key"></i> Tài khoản mẫu dùng thử:</strong>
        <div class="mt-1">
          • <strong>Admin:</strong> <code>admin@travel.com</code> / <code>Admin123!</code><br>
          • <strong>User:</strong> <code>user@travel.com</code> / <code>User123!</code>
        </div>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        Chưa có tài khoản? <a href="register.html" id="registerLink" style="font-weight: 700;">Đăng ký ngay</a>
      </div>
    </div>

  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = urlParams.get('redirect');

      if (redirectUrl) {
        document.getElementById('registerLink').href = `register.html?redirect=${encodeURIComponent(redirectUrl)}`;
        const alertBox = document.getElementById('loginAlert');
        alertBox.style.display = 'block';
        alertBox.style.backgroundColor = '#fef3c7';
        alertBox.style.color = '#92400e';
        alertBox.innerHTML = '<i class="fa-solid fa-lock"></i> Vui lòng đăng nhập để hoàn tất đơn đặt chỗ của bạn.';
      }

      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const identity = document.getElementById('loginIdentity').value.trim();
        const pass = document.getElementById('loginPassword').value;
        const alertBox = document.getElementById('loginAlert');

        const res = handleLogin(identity, pass);
        if (res.success) {
          alertBox.style.display = 'block';
          alertBox.style.backgroundColor = '#dcfce7';
          alertBox.style.color = '#166534';
          alertBox.textContent = res.message;

          setTimeout(() => {
            if (res.user.role === 'admin') {
              window.location.href = 'admin/dashboard.html';
            } else if (redirectUrl) {
              window.location.href = redirectUrl;
            } else {
              window.location.href = 'index.html';
            }
          }, 800);
        } else {
          alertBox.style.display = 'block';
          alertBox.style.backgroundColor = '#fee2e2';
          alertBox.style.color = '#991b1b';
          alertBox.textContent = res.message;
        }
      });
    });
  </script>
</body>
</html>
