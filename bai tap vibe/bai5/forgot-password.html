<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên Mật Khẩu - TravelViet</title>
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-color: var(--bg-main); display: flex; align-items: center; justify-content: center; min-height: 100vh;">

  <div style="width: 100%; max-width: 440px; padding: 1.5rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="logo" style="justify-content: center; font-size: 2rem;">
        <i class="fa-solid fa-plane-departure" style="color: var(--accent);"></i> TravelViet
      </a>
    </div>

    <div class="search-box-card">
      <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem; text-align: center;">Khôi Phục Mật Khẩu</h2>
      <p style="color: var(--text-muted); font-size: 0.88rem; text-align: center; margin-bottom: 1.5rem;">Nhập email đã đăng ký để nhận thông tin hướng dẫn đặt lại mật khẩu.</p>

      <div id="forgotAlert" style="display: none; padding: 0.8rem; border-radius: var(--radius-sm); margin-bottom: 1.2rem; font-size: 0.88rem;"></div>

      <form id="forgotForm">
        <div class="form-group">
          <label class="form-label">Địa chỉ Email của bạn</label>
          <input type="email" id="forgotEmail" class="form-control" placeholder="example@email.com" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">
          <i class="fa-solid fa-paper-plane"></i> Gửi Yêu Cầu Khôi Phục
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Quay lại Đăng nhập</a>
      </div>
    </div>

  </div>

  <script src="js/main.js"></script>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();
      const alertBox = document.getElementById('forgotAlert');

      alertBox.style.display = 'block';
      alertBox.style.backgroundColor = '#dcfce7';
      alertBox.style.color = '#166534';
      alertBox.innerHTML = `<i class="fa-solid fa-check-circle"></i> Đã gửi email hướng dẫn đặt lại mật khẩu đến <strong>${email}</strong>. Vui lòng kiểm tra hộp thư.`;
    });
  </script>
</body>
</html>
