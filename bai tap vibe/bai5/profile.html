<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ Sơ Cá Nhân - TravelViet</title>
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar">
        <a href="index.html" class="logo">
          <i class="fa-solid fa-plane-departure"></i>
          <span>TravelViet</span>
        </a>
        <div class="nav-links">
          <a href="index.html"><i class="fa-solid fa-house"></i> Trang Chủ</a>
          <a href="flights.html"><i class="fa-solid fa-plane"></i> Chuyến Bay</a>
          <a href="tours.html"><i class="fa-solid fa-route"></i> Tour Du Lịch</a>
        </div>
        <div class="header-actions">
          <a href="cart.html" class="cart-icon-btn" title="Giỏ hàng">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-badge">0</span>
          </a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Page Layout -->
  <main class="container" style="margin-top: 3rem; margin-bottom: 4rem;">
    <div class="page-layout-2col" style="grid-template-columns: 300px 1fr;">
      
      <!-- Profile Card (Left) -->
      <div>
        <div class="detail-header-card text-center">
          <img id="profAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80" style="width:100px; height:100px; border-radius:50%; object-fit:cover; margin:0 auto 1rem; border:3px solid var(--primary);">
          <h2 id="profFullName" style="font-size:1.3rem; font-weight:800;">Tên Người Dùng</h2>
          <p id="profRole" style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1rem;">Khách hàng thành viên</p>
          
          <button id="profLogoutBtn" class="btn btn-outline btn-sm btn-block"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</button>
        </div>
      </div>

      <!-- Detail Tabs (Right) -->
      <div>
        <div class="detail-header-card">
          <h3 style="font-size:1.2rem; font-weight:700; margin-bottom:1.2rem; border-bottom:1px solid var(--border-color); padding-bottom:0.8rem;">Thông Tin Tài Khoản</h3>
          
          <form id="profileForm">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
              <div class="form-group">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" id="profUsername" class="form-control" readonly style="background:#f1f5f9;">
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="profEmail" class="form-control" readonly style="background:#f1f5f9;">
              </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
              <div class="form-group">
                <label class="form-label">Họ và tên</label>
                <input type="text" id="profEditFullName" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">Số điện thoại</label>
                <input type="tel" id="profPhone" class="form-control">
              </div>
            </div>

            <button type="submit" class="btn btn-primary mt-2"><i class="fa-solid fa-floppy-disk"></i> Lưu Thay Đổi</button>
          </form>
        </div>

        <!-- Booking History Section -->
        <div class="detail-header-card" style="margin-top:2rem;">
          <h3 style="font-size:1.2rem; font-weight:700; margin-bottom:1.2rem; border-bottom:1px solid var(--border-color); padding-bottom:0.8rem;"><i class="fa-solid fa-clock-rotate-left"></i> Lịch Sử Đặt Chỗ Cá Nhân</h3>
          
          <div id="bookingHistoryContainer">
            <p class="text-center" style="color:var(--text-muted); padding:2rem;">Đang tải lịch sử đặt chỗ...</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p>&copy; 2026 TravelViet. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireUserGuard()) return;

      const user = getCurrentUser();

      function loadProfile() {
        if (!user) return;
        document.getElementById('profAvatar').src = user.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80';
        document.getElementById('profFullName').textContent = user.full_name || user.username;
        document.getElementById('profRole').textContent = user.role === 'admin' ? 'Quản Trị Viên (Admin)' : 'Thành Viên Vàng (Member)';
        
        document.getElementById('profUsername').value = user.username;
        document.getElementById('profEmail').value = user.email;
        document.getElementById('profEditFullName').value = user.full_name || '';
        document.getElementById('profPhone').value = user.phone || '';

        loadBookingHistory();
      }

      function loadBookingHistory() {
        if (!db) {
          setTimeout(loadBookingHistory, 200);
          return;
        }

        const bookings = dbQuery(`SELECT * FROM bookings WHERE user_id = ? OR customer_email = ? ORDER BY id DESC`, [user.id, user.email]);
        const container = document.getElementById('bookingHistoryContainer');

        if (bookings.length === 0) {
          container.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding:1.5rem;">Bạn chưa có lịch sử đặt vé hoặc tour nào.</p>`;
          return;
        }

        container.innerHTML = bookings.map(b => {
          let items = [];
          try {
            items = JSON.parse(b.item_details);
            if (!Array.isArray(items)) items = [items];
          } catch (e) {
            items = [];
          }

          const itemsHtml = items.map(item => `
            <div style="display:flex; align-items:center; justify-content:space-between; padding:0.6rem 0; border-bottom:1px dashed var(--border-color); font-size:0.88rem;">
              <div>
                <strong style="color:var(--primary);">${item.title || item.itemTitle || 'Dịch vụ TravelViet'}</strong>
                <div style="font-size:0.78rem; color:var(--text-muted);">${item.subInfo || item.route || item.class || ''}</div>
              </div>
              <div><strong>${formatVND(item.price || b.total_amount)}</strong></div>
            </div>
          `).join('');

          return `
            <div style="border:1px solid var(--border-color); border-radius:var(--radius-md); padding:1.2rem; margin-bottom:1.2rem; background:#ffffff; box-shadow:var(--shadow-sm);">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem; border-bottom:1px solid var(--border-color); padding-bottom:0.6rem;">
                <div>
                  <span style="font-size:1.1rem; font-weight:800; color:var(--text-main);">Mã Đơn: ${b.booking_code}</span>
                  <span style="font-size:0.78rem; color:var(--text-muted); margin-left:0.8rem;">Ngày đặt: ${b.created_at || 'Gần đây'}</span>
                </div>
                <span class="badge badge-success"><i class="fa-solid fa-circle-check"></i> Đã Xác Nhận</span>
              </div>

              <div style="margin-bottom:0.8rem;">
                ${itemsHtml}
              </div>

              <div style="display:flex; justify-content:space-between; align-items:center; padding-top:0.4rem;">
                <span style="font-size:0.85rem; color:var(--text-muted);">Email nhận: ${b.customer_email}</span>
                <div>
                  <span style="font-size:0.88rem;">Tổng thanh toán: </span>
                  <strong style="font-size:1.2rem; color:var(--accent);">${formatVND(b.total_amount)}</strong>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById('profLogoutBtn').addEventListener('click', () => logoutUser());

      document.getElementById('profileForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const newName = document.getElementById('profEditFullName').value.trim();
        const newPhone = document.getElementById('profPhone').value.trim();

        dbUpdate('users', user.id, { full_name: newName, phone: newPhone });
        user.full_name = newName;
        user.phone = newPhone;
        setActiveUserSession(user);
        
        showToast('Cập nhật thông tin thành công!', 'success');
        loadProfile();
      });

      loadProfile();
    });
  </script>
</body>
</html>
