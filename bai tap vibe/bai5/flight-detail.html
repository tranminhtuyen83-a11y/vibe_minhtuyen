<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Chuyến Bay - TravelViet</title>
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar">
        <a href="index.html" class="logo">
          <i class="fa-solid fa-plane-departure"></i>
          <span>TravelViet</span>
        </a>
        <div class="nav-links">
          <a href="index.html"><i class="fa-solid fa-house"></i> Trang Chủ</a>
          <a href="flights.html" class="active"><i class="fa-solid fa-plane"></i> Chuyến Bay</a>
          <a href="tours.html"><i class="fa-solid fa-route"></i> Tour Du Lịch</a>
        </div>
        <div class="header-actions">
          <a href="cart.html" class="cart-icon-btn" title="Giỏ hàng">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-badge">0</span>
          </a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Main Detail Content -->
  <main class="container" style="margin-top: 3rem; margin-bottom: 4rem;">
    <div id="flightDetailContainer">
      <div class="text-center" style="padding: 4rem;">
        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--primary);"></i>
        <p class="mt-2">Đang tải thông tin chuyến bay...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p>&copy; 2026 TravelViet. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const flightId = urlParams.get('id');

      let selectedFareClass = 'economy';
      let currentFlight = null;

      function loadFlightDetail() {
        if (!db) {
          setTimeout(loadFlightDetail, 200);
          return;
        }

        if (!flightId) {
          document.getElementById('flightDetailContainer').innerHTML = `
            <div class="text-center" style="padding:4rem;">
              <h2>Không tìm thấy chuyến bay</h2>
              <a href="flights.html" class="btn btn-primary mt-3">Quay lại danh sách</a>
            </div>
          `;
          return;
        }

        const flights = dbQuery(`
          SELECT f.*, a.name as airline_name, a.code as airline_code, a.logo_url
          FROM flights f
          LEFT JOIN airlines a ON f.airline_id = a.id
          WHERE f.id = ?
        `, [flightId]);

        if (flights.length === 0) {
          document.getElementById('flightDetailContainer').innerHTML = `
            <div class="text-center" style="padding:4rem;">
              <h2>Chuyến bay không tồn tại</h2>
              <a href="flights.html" class="btn btn-primary mt-3">Quay lại danh sách</a>
            </div>
          `;
          return;
        }

        currentFlight = flights[0];
        renderFlightDetail();
      }

      function renderFlightDetail() {
        const f = currentFlight;
        const container = document.getElementById('flightDetailContainer');

        container.innerHTML = `
          <div class="detail-header-card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1.5rem; border-bottom:1px solid var(--border-color); padding-bottom:1.5rem; margin-bottom:1.5rem;">
              <div style="display:flex; align-items:center; gap:1.2rem;">
                <img src="${f.logo_url}" style="width:64px; height:64px; border-radius:50%; object-fit:cover; border:1px solid var(--border-color);">
                <div>
                  <h2 style="font-size:1.6rem; font-weight:800;">${f.airline_name} (${f.flight_code})</h2>
                  <p style="color:var(--text-muted);">Tàu bay: <strong>${f.aircraft_type}</strong> | Loại: <strong>${f.flight_type === 'direct' ? 'Bay thẳng' : '1 điểm dừng'}</strong></p>
                </div>
              </div>
              <a href="flights.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
            </div>

            <div class="flight-timeline" style="margin: 2rem 0; justify-content: space-around;">
              <div class="flight-time-box">
                <h3 style="font-size:1.8rem; font-weight:800; color:var(--primary);">${formatTime(f.departure_time)}</h3>
                <p style="font-weight:700; font-size:1.1rem;">${f.departure_city}</p>
                <p style="font-size:0.85rem; color:var(--text-muted);">${formatDate(f.departure_time)}</p>
              </div>

              <div class="flight-duration-box" style="width: 220px;">
                <span style="font-size:0.9rem; font-weight:700; color:var(--text-muted);">${Math.floor(f.duration_minutes / 60)} Giờ ${f.duration_minutes % 60} Phút</span>
                <div class="flight-duration-line" style="margin:0.8rem 0;">
                  <i class="fa-solid fa-plane" style="font-size:1.2rem;"></i>
                </div>
                <span class="badge ${f.flight_type === 'direct' ? 'badge-success' : 'badge-warning'}">${f.flight_type === 'direct' ? 'Bay thẳng' : 'Transit'}</span>
              </div>

              <div class="flight-time-box">
                <h3 style="font-size:1.8rem; font-weight:800; color:var(--primary);">${formatTime(f.arrival_time)}</h3>
                <p style="font-weight:700; font-size:1.1rem;">${f.arrival_city}</p>
                <p style="font-size:0.85rem; color:var(--text-muted);">${formatDate(f.arrival_time)}</p>
              </div>
            </div>
          </div>

          <h3 style="font-size:1.4rem; font-weight:800; margin-bottom:1rem;">Chọn Hạng Ghế & Vé</h3>
          
          <div class="fare-selection-grid">
            
            <!-- Economy Fare Card -->
            <div class="fare-card ${selectedFareClass === 'economy' ? 'selected' : ''}" id="cardEconomy">
              <div class="badge badge-primary mb-2">Hạng Phổ Thông</div>
              <div class="fare-title">Economy Class</div>
              <div class="fare-price">${formatVND(f.price_economy)}</div>
              <ul class="fare-benefits">
                <li><i class="fa-solid fa-check"></i> Hành lý xách tay 7kg</li>
                <li><i class="fa-solid fa-check"></i> Hành lý ký gửi 20kg</li>
                <li><i class="fa-solid fa-check"></i> Suất ăn tiêu chuẩn trên chuyến bay</li>
                <li><i class="fa-solid fa-check"></i> Tự chọn chỗ ngồi trước</li>
              </ul>
            </div>

            <!-- Business Fare Card -->
            <div class="fare-card ${selectedFareClass === 'business' ? 'selected' : ''}" id="cardBusiness">
              <div class="badge badge-warning mb-2">Hạng Thương Gia</div>
              <div class="fare-title">Business Class</div>
              <div class="fare-price">${formatVND(f.price_business)}</div>
              <ul class="fare-benefits">
                <li><i class="fa-solid fa-check"></i> Phòng chờ VIP Thương Gia tại sân bay</li>
                <li><i class="fa-solid fa-check"></i> Hành lý xách tay 14kg + Ký gửi 40kg</li>
                <li><i class="fa-solid fa-check"></i> Ghế ngồi ngả phẳng 180 độ cao cấp</li>
                <li><i class="fa-solid fa-check"></i> Ưu tiên check-in & lối đi riêng</li>
                <li><i class="fa-solid fa-check"></i> Thực đơn đồ ăn & rượu vang đặc biệt</li>
              </ul>
            </div>

          </div>

          <div style="margin-top: 2.5rem; text-align: right; display:flex; justify-content:flex-end; gap:1rem;">
            <button id="btnAddToCart" class="btn btn-outline btn-lg">
              <i class="fa-solid fa-cart-plus"></i> Thêm Vào Giỏ Hàng
            </button>
            <button id="btnBookNow" class="btn btn-accent btn-lg">
              <i class="fa-solid fa-credit-card"></i> Đặt Chỗ Ngay
            </button>
          </div>
        `;

        // Fare class selection toggles
        const cardEconomy = document.getElementById('cardEconomy');
        const cardBusiness = document.getElementById('cardBusiness');

        cardEconomy.addEventListener('click', () => {
          selectedFareClass = 'economy';
          cardEconomy.classList.add('selected');
          cardBusiness.classList.remove('selected');
        });

        cardBusiness.addEventListener('click', () => {
          selectedFareClass = 'business';
          cardBusiness.classList.add('selected');
          cardEconomy.classList.remove('selected');
        });

        // Add to Cart handler
        document.getElementById('btnAddToCart').addEventListener('click', () => {
          const price = selectedFareClass === 'economy' ? f.price_economy : f.price_business;
          const fareName = selectedFareClass === 'economy' ? 'Hạng Phổ Thông' : 'Hạng Thương Gia';
          
          addToCart({
            id: f.id,
            type: 'flight',
            title: `Vé máy bay ${f.airline_name} (${f.flight_code})`,
            code: f.flight_code,
            subInfo: `${f.departure_city} → ${f.arrival_city} | ${fareName}`,
            class: fareName,
            price: price,
            quantity: 1,
            image: f.logo_url
          });
        });

        // Book Now handler
        document.getElementById('btnBookNow').addEventListener('click', () => {
          const price = selectedFareClass === 'economy' ? f.price_economy : f.price_business;
          const fareName = selectedFareClass === 'economy' ? 'Hạng Phổ Thông' : 'Hạng Thương Gia';
          
          addToCart({
            id: f.id,
            type: 'flight',
            title: `Vé máy bay ${f.airline_name} (${f.flight_code})`,
            code: f.flight_code,
            subInfo: `${f.departure_city} → ${f.arrival_city} | ${fareName}`,
            class: fareName,
            price: price,
            quantity: 1,
            image: f.logo_url
          });
          window.location.href = 'cart.html';
        });
      }

      loadFlightDetail();
    });
  </script>
</body>
</html>
