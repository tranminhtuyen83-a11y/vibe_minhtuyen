<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản - TravelViet</title>
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body style="background-color: var(--bg-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 0;">

  <div style="width: 100%; max-width: 480px; padding: 1.5rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="logo" style="justify-content: center; font-size: 2rem;">
        <i class="fa-solid fa-plane-departure" style="color: var(--accent);"></i> TravelViet
      </a>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">Tạo tài khoản mới để nhận ưu đãi du lịch hấp dẫn</p>
    </div>

    <div class="search-box-card">
      <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 1.5rem; text-align: center;">Đăng Ký Thành Viên</h2>

      <div id="registerAlert" style="display: none; padding: 0.8rem; border-radius: var(--radius-sm); margin-bottom: 1.2rem; font-size: 0.88rem;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label">Tên đăng nhập * (5-15 ký tự, không ký tự đặc biệt)</label>
          <input type="text" id="regUsername" class="form-control" placeholder="user123" minlength="5" maxlength="15" required>
        </div>

        <div class="form-group">
          <label class="form-label">Họ và tên</label>
          <input type="text" id="regFullName" class="form-control" placeholder="Nguyễn Văn A">
        </div>

        <div class="form-group">
          <label class="form-label">Địa chỉ Email *</label>
          <input type="email" id="regEmail" class="form-control" placeholder="email@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Số điện thoại * (Đúng 10 số)</label>
          <input type="tel" id="regPhone" class="form-control" placeholder="0901234567" maxlength="10" required>
        </div>

        <div class="form-group">
          <label class="form-label">Địa chỉ (Tối đa 100 ký tự)</label>
          <input type="text" id="regAddress" class="form-control" placeholder="Số nhà, tên đường..." maxlength="100">
        </div>

        <div class="form-group">
          <label class="form-label">Mật khẩu * (5-15 ký tự)</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" minlength="5" maxlength="15" required>
        </div>

        <div class="form-group">
          <label class="form-label">Xác nhận mật khẩu *</label>
          <input type="password" id="regConfirmPassword" class="form-control" placeholder="••••••••" minlength="5" maxlength="15" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">
          <i class="fa-solid fa-user-plus"></i> Đăng Ký Tài Khoản (USER)
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        Đã có tài khoản? <a href="login.html" style="font-weight: 700;">Đăng nhập</a>
      </div>
    </div>

  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = urlParams.get('redirect');

      document.getElementById('registerForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const username = document.getElementById('regUsername').value.trim();
        const fullName = document.getElementById('regFullName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const address = document.getElementById('regAddress').value.trim();
        const pass = document.getElementById('regPassword').value;
        const confirmPass = document.getElementById('regConfirmPassword').value;

        const alertBox = document.getElementById('registerAlert');

        const res = handleRegister(username, email, pass, confirmPass, fullName, phone, address);
        if (res.success) {
          alertBox.style.display = 'block';
          alertBox.style.backgroundColor = '#dcfce7';
          alertBox.style.color = '#166534';
          alertBox.textContent = res.message;

          setTimeout(() => {
            if (redirectUrl) {
              window.location.href = redirectUrl;
            } else {
              window.location.href = 'index.html';
            }
          }, 1200);
        } else {
          alertBox.style.display = 'block';
          alertBox.style.backgroundColor = '#fee2e2';
          alertBox.style.color = '#991b1b';
          alertBox.textContent = res.message;
        }
      });
    });
  </script>
</body>
</html>
